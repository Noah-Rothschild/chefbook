# Render Blueprint for the Django API. In Render: New > Blueprint, pick this
# repo, then fill in the values marked "sync: false" when asked.
services:
  - type: web
    name: chefbook-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn backend.wsgi:application
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Neon connection string, e.g. postgresql://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SPOONACULAR_API_KEY
        sync: false
      # The Vercel site's address, e.g. https://chefbook.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
